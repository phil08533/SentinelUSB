name: Build SentinelUSB ISO

on:
  workflow_dispatch:
  push:
    paths:
      - "live-build/**"
      - "src/**"
      - ".github/workflows/build-iso.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install live-build
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap cpio wget debian-archive-keyring xorriso
          wget -q https://deb.debian.org/debian/pool/main/l/live-build/live-build_20250505+deb13u1_all.deb
          sudo dpkg -i live-build_20250505+deb13u1_all.deb

      - name: Validate SentinelUSB scripts
        run: |
          python3 -m py_compile live-build/config/includes.chroot/usr/local/lib/sentinelusb/cli.py
          python3 -m py_compile live-build/config/includes.chroot/usr/local/lib/sentinelusb/scanner.py
          python3 -m py_compile live-build/config/includes.chroot/usr/local/lib/sentinelusb/storage.py
          python3 -m py_compile live-build/config/includes.chroot/usr/local/lib/sentinelusb/gui.py

      - name: Build ISO
        working-directory: live-build
        run: |
          chmod +x auto/config
          sudo lb build

      - name: Verify and prepare artifact
        working-directory: live-build
        run: |
          ISO="$(find . -maxdepth 1 -type f -name '*.iso' -print -quit)"
          test -n "$ISO"
          cp "$ISO" SentinelUSB.iso
          test "$(file -b SentinelUSB.iso | grep -c 'ISO 9660')" -eq 1
          xorriso -indev SentinelUSB.iso -toc >/tmp/sentinel-xorriso.txt 2>&1
          sha256sum SentinelUSB.iso > SentinelUSB.iso.sha256
          rm -f SentinelUSB.iso.part-*
          split -b 250M -d -a 2 SentinelUSB.iso SentinelUSB.iso.part-
          PARTS="$(find . -maxdepth 1 -type f -name 'SentinelUSB.iso.part-*' | wc -l)"
          test "$PARTS" -ge 1
          test "$PARTS" -le 5
          sha256sum SentinelUSB.iso.part-* > SentinelUSB.iso.parts.sha256
          ls -lh SentinelUSB.iso SentinelUSB.iso.part-*

      - name: Upload ISO part 00
        uses: actions/upload-artifact@v4
        with:
          name: SentinelUSB-ISO-part-00
          path: |
            live-build/SentinelUSB.iso.part-00
            live-build/SentinelUSB.iso.sha256
            live-build/SentinelUSB.iso.parts.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload ISO part 01
        uses: actions/upload-artifact@v4
        with:
          name: SentinelUSB-ISO-part-01
          path: live-build/SentinelUSB.iso.part-01
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload ISO part 02
        uses: actions/upload-artifact@v4
        with:
          name: SentinelUSB-ISO-part-02
          path: live-build/SentinelUSB.iso.part-02
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload ISO part 03
        if: ${{ hashFiles('live-build/SentinelUSB.iso.part-03') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: SentinelUSB-ISO-part-03
          path: live-build/SentinelUSB.iso.part-03
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload ISO part 04
        if: ${{ hashFiles('live-build/SentinelUSB.iso.part-04') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: SentinelUSB-ISO-part-04
          path: live-build/SentinelUSB.iso.part-04
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
